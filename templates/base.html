<!DOCTYPE html>
<html>
<head>
<link type="text/css" href="{{url_for('static',filename ='css/styles.css')}}" rel ="stylesheet"/>
<link rel="shortcut icon" href="{{ url_for('static', filename='images/icon.jpeg') }}" type="images/icon.jpeg">

{% block title-%}
{% if title -%}
    <title>название приложения - {{title}}</title>
{% else -%}
    <title> Квартира РУ</title>
{% endif -%}
    {% endblock -%}
</head>
<body>
{% block content -%}
    {% block mainmenu -%}
    <h3>Добро пожаловать!</h3>
    <ul class=" mainmenu">
        {% for m in menu -%}
            <li><a class="my-button" href="{{m.url}}">{{m.title}}</a></li>
            {% endfor -%}
    </ul>
    {% endblock mainmenu -%}
{% endblock -%}

</body>

</html>
